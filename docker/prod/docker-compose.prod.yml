version: '3.8'

services:
  web:
    build:
      context: ../../
      dockerfile: ./docker/prod/Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 notif_project.asgi:application
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - 8000
    env_file:
      - ../../.env.prod
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  celery:
    build:
      context: ../../
      dockerfile: ./docker/prod/Dockerfile
    command: /bin/sh /app/scripts/start-celery.sh
    env_file:
      - ../../.env.prod
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
      - ../../nginx/prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    restart: unless-stopped

volumes:
  static_volume:
