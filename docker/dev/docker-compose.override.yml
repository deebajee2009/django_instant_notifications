services:
  web:
    build:
      context: ./
      dockerfile: ./docker/dev/Dockerfile
    command: /bin/sh -c "/app/scripts/wait-for-postgres.sh postgres && python manage.py migrate && daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    env_file:
      - ./docker/dev/.env.dev
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  celery:
    build:
      context: ./
      dockerfile: ./docker/dev/Dockerfile
    command: /bin/sh -c "/app/scripts/wait-for-postgres.sh postgre && celery -A notif_project worker -l info"
    volumes:
      - ./:/app
    env_file:
      - ./docker/dev/.env.dev
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    restart: unless-stopped
