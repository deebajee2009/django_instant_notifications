
{% load static %}

{% load jalali_tags %}
<span id="notification-badge" hx-swap-oob="innerHTML" class="badge bg-danger rounded-pill">{{unread_notif_counts}}</span>
<div class="d-flex">


    <div class="container-fluid flex-grow-1">


        <main class="container-fluid p-4">

            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">جستجو در بازه زمانی</h5>
                    <form id="date-filter-form"
                          hx-post="{% url 'apps.notifications:dashboard' username=username %}"
                          hx-target="#messages-box"
                          hx-swap="innerHTML"
                          class="row g-3 align-items-end">
                        {% csrf_token %}
                        <div class="col-md-4">
                            <label for="id_start_date" class="form-label">از تاریخ</label>
                            <input type="text" name="start_date" data-jdp class="form-control" placeholder="YYYY/MM/DD" id="id_start_date" data-jdp required>
                        </div>
                        <div class="col-md-4">
                            <label for="id_end_date" class="form-label">تا تاریخ</label>
                            <input type="text" name="end_date" data-jdp class="form-control" placeholder="YYYY/MM/DD" id="id_end_date" data-jdp required>
                        </div>
                        <div class="col-md-auto">
                            <button type="submit" class="btn btn-primary">فیلتر کن</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                  صندوق پیام کاربر: <strong id="username-display">{{ username }}</strong>
                </div>
                <div id="messages-box">
                    {% include 'partials/message_list.html' %}
                </div>
            </div>
        </main>
    </div>
</div>

<div id="websocket-handler" ws-connect="/ws/notifications/{{ username }}/"></div>
<script type="text/javascript" defer>
    jalaliDatepicker.startWatch({
        // You can add options here if you want
        // For example:
        // theme: 'dark'
    });
</script>
<script defer>
    // Wait for the entire page to be loaded before running the script
    document.addEventListener('DOMContentLoaded', (event) => {

        // Find your form by its ID
        const dateFilterForm = document.getElementById('date-filter-form');

        // Listen for the 'htmx:afterSwap' event on the form
        dateFilterForm.addEventListener('htmx:afterSwap', function(evt) {
            // Use the built-in reset() method to clear all form fields
            console.log('HTMX request complete. Resetting form.');
            this.reset();
        });

    });
</script>
